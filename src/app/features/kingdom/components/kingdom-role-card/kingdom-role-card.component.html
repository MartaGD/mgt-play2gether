<p class="status">{{ message }}</p>  

<section
  class="panel card-shell"
  [class.traitor]="roleCard.role === 'BANDIT' || roleCard.role === 'USURPER'"
  [class.assassin]="roleCard.role === 'ASSASSIN'"
  [class.leader]="roleCard.role === 'KING'"
  [class.knight]="roleCard.role === 'KNIGHT'"
>
  <article class="card-frame">
    <header class="card-header">
        <img [src]="cardImageUrl" alt="Role card artwork" class="card-icon" width="18px" height="18px"/>
        {{ roleCard.title }}</header>
    <div class="card-body">
      <p><strong>{{ t.identityLabel }}:</strong> {{ roleCard.role }}</p>
      <p class="card-text" [innerHTML]="roleCard.objective | objectiveText"></p>
    </div>
    <footer class="card-footer">
      <p><strong>{{ t.teamLabel }}:</strong> {{ roleCard.team }}</p>
      <p>{{ roleCard.hint }}</p>
    </footer>
  </article>
</section>

  <div class="action-row">
    <button type="button" [disabled]="busy" class="muted" (click)="refreshRoomClick.emit()">{{ t.refreshRoomButton }}</button>
    <button type="button" [disabled]="busy" class="muted" (click)="leaveRoomClick.emit()">{{ t.leaveRoomButton }}</button>
  </div>
