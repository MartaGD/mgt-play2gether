<main class="page">
  @if (!store.room() && !debugRoleCard()) {
    <app-kingdom-home
      [appTitle]="store.appTitle"
      [busy]="store.busy()"
      [message]="store.message()"
      (createRoomClick)="store.createRoom()"
      (joinRoomClick)="store.joinRoom()"
    />
  }

  @if (store.room() && !visibleRoleCard()) {
    <app-kingdom-room
      [room]="store.room()!"
      [activePlayerCode]="store.activePlayerCode()"
      [isHost]="store.isHost()"
      [currentPlayer]="store.currentPlayer()"
      [busy]="store.busy()"
      [isDealing]="store.isDealing()"
      [message]="store.message()"
      (refreshClick)="store.refreshRoom()"
      (startGameClick)="store.startGame()"
      (leaveRoomClick)="store.leaveRoom()"
    />
  }

  @if (visibleRoleCard()) {
    <app-kingdom-role-card
      [roleCard]="visibleRoleCard()!"
      [cardImageUrl]="visibleCardImageUrl()"
      [busy]="store.busy()"
      [message]="store.message()"
      (refreshRoomClick)="store.refreshRoom()"
      (leaveRoomClick)="store.leaveRoom()"
    />
  }
</main>
