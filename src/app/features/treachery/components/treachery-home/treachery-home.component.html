<section class="panel hero">
  <p class="eyebrow">Magic: The Gathering</p>
  <h1>{{ appTitle }}</h1>
  <p class="subtitle">
    Create a room, share the code, and reveal your identity when the game starts.
  </p>

  <div class="action-row">
    <button type="button" [disabled]="busy" (click)="createRoomClick.emit()">Create room</button>
    <button type="button" [disabled]="busy" class="muted" (click)="joinRoomClick.emit()">Join room</button>
  </div>

  <p class="status">{{ message }}</p>
</section>
