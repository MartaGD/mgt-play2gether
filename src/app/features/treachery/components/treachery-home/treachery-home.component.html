<section class="panel hero">
  <p class="eyebrow">{{t.subtitle}}</p>
  <h1>{{ appTitle }}</h1>
  <p class="subtitle">
    {{ t.description }}
  </p>

  <div class="action-row">
    <button type="button" [disabled]="busy" (click)="createRoomClick.emit()">
      <i class="bi bi-plus-square-fill" aria-hidden="true"></i>
      <span>{{ t.createButton }}</span>
    </button>
    <button type="button" [disabled]="busy" class="muted" (click)="joinRoomClick.emit()">
      <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
      <span>{{ t.joinButton }}</span>
    </button>
  </div>

  <p class="status">{{ message }}</p>
</section>
