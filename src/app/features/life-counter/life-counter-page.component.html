<section class="life-counter-page">
  <div class="page-header">
    <h1>{{ t.counterTitle }}</h1>
    <button type="button" class="secondary-button" (click)="resetPlayers()">{{ t.resetButton }}</button>
  </div>

  <div class="players-grid">
    <article class="player-card" *ngFor="let player of players; let index = index">
      <h2>{{ player.name }}</h2>
  
      <div class="life-actions">
        <button type="button" class="damage-button" (click)="changeLife(index, -1)">-</button>
        <p class="life-value">{{ player.life }}</p>
        <button type="button" class="health-button" (click)="changeLife(index, 1)">+</button>
      </div>

      <div class="special-buttons">
        <button type="button" *ngFor="let amount of damageOptions" (click)="applyDamage(index, amount)">
          -{{ amount }}
        </button>
      </div>
    </article>
  </div>
</section>
