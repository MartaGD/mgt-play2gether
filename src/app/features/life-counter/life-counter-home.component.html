<section class="life-counter-home">
  <div class="panel">
    <p class="eyebrow">{{ t.homeTitle }}</p>
    <h1>{{ t.homeTitle }}</h1>
    <p class="description">{{ t.homeDescription }}</p>

    <div class="controls">
      <label>
        <span>{{ t.playerCountLabel }}</span>
        <select [(ngModel)]="playerCount" name="playerCount">
          <option *ngFor="let count of playerOptions" [value]="count">{{ count }}</option>
        </select>
      </label>

      <label>
        <span>{{ t.startingLifeLabel }}</span>
        <input type="number" [(ngModel)]="startingLife" name="startingLife" min="1" max="999" />
      </label>
    </div>

    <button type="button" class="start-button" (click)="startCounter()">{{ t.startButton }}</button>
  </div>
</section>
