<section class="life-counter-home">
  <div class="panel">
    <p class="eyebrow">Nueva feature</p>
    <h1>Contador de vidas</h1>
    <p class="description">Elige cuántos jugadores participan y cuánta vida inicial tendrán.</p>

    <div class="controls">
      <label>
        <span>Número de jugadores</span>
        <select [(ngModel)]="playerCount" name="playerCount">
          <option *ngFor="let count of playerOptions" [value]="count">{{ count }}</option>
        </select>
      </label>

      <label>
        <span>Vidas iniciales</span>
        <input type="number" [(ngModel)]="startingLife" name="startingLife" min="1" max="999" />
      </label>
    </div>

    <button type="button" class="start-button" (click)="startCounter()">Iniciar contador</button>
  </div>
</section>
