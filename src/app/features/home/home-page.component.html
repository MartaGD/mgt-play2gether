<section class="home-wrap">
  <article class="intro-card">
    <p class="eyebrow">{{ t.eyebrow }}</p>
    <h1>{{ t.title }}</h1>
    <p>{{ t.description }}</p>
    <div class="cta-row">
      <a class="cta-main" routerLink="/treachery">{{ t.primaryCta }}</a>
      <a class="cta-ghost" routerLink="/treachery">{{ t.secondaryCta }}</a>
    </div>
  </article>

  <article class="new-card">
    <p class="eyebrow">MTG Social Hub</p>
    <h1>{{ t.moreTitle }}</h1>
    <p>{{ t.moreDescription }}</p>
    <div class="cta-row"></div>
  </article>

  <article class="intro-card">
    <p class="eyebrow">{{ t.eyebrow }}</p>
    <h1>{{ t.lifeTitle }}</h1>
    <p>{{ t.lifeDescription }}</p>
    <div class="cta-row">
      <a class="cta-main" routerLink="/life-counter">{{ t.lifeCta }}</a>
    </div>
  </article>
</section>
